<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LegalEase AI - Simple Legal Information</title>
    <script>
      // Prevent some libraries from trying to override fetch if they detect it's missing or want to patch it
      // In AI Studio, window.fetch is a getter and cannot be set.
      try {
        const originalFetch = window.fetch;
        Object.defineProperty(window, 'fetch', {
          value: originalFetch,
          writable: false,
          configurable: false
        });
      } catch (e) {
        console.warn('Could not lock fetch:', e);
      }
    </script>
    <meta name="description" content="AI-powered legal information assistant helping people understand legal issues in simple language." />
    <meta property="og:title" content="LegalEase AI - Simple Legal Information" />
    <meta property="og:description" content="AI-powered legal information assistant helping people understand legal issues in simple language." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
